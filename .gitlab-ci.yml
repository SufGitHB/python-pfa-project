stages:
  - test
  - sonarqube
  - build
  - deploy

variables:
  IMAGE_NAME: "soufiane474/pfa-project"
  IMAGE_TAG: "${CI_COMMIT_TAG}"

run_tests:
  stage: test
  image: python:3.9-slim
  before_script:
    - apt-get update && apt-get install -y make gcc python3-dev
    - python3 -m pip install --upgrade pip
    - pip install -r src/requirements.txt
    - pip install pytest==7.4.4 pytest-cov==4.1.0
  script:
    - make test
    - pytest --cov=. --cov-report=xml:coverage.xml
  artifacts:
    when: always
    paths:
      - coverage.xml
      - .coverage
    expire_in: 1 week

sonarcloud_scan:
  stage: sonarqube
  image: sonarsource/sonar-scanner-cli:latest
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  dependencies:
    - run_tests
  script:
    - |
      sonar-scanner \
        -Dsonar.organization="${SONAR_ORG}" \
        -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
        -Dsonar.projectName="${SONAR_PROJECT_NAME}" \
        -Dsonar.sources="." \
        -Dsonar.python.version=3.9 \
        -Dsonar.python.coverage.reportPaths="coverage.xml" \
        -Dsonar.host.url="https://sonarcloud.io" \
        -Dsonar.login="${SONAR_TOKEN}"
  allow_failure: false

build_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$REGISTRY_PASS" | docker login -u "$DOCKER_USER" --password-stdin
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" .
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
    - docker logout

deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client sshpass docker-cli
  script: |
    sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no cloud_user@18.175.172.248 "
      DOCKER_USER=$DOCKER_USER REGISTRY_PASS=$REGISTRY_PASS IMAGE_NAME=$IMAGE_NAME IMAGE_TAG=$IMAGE_TAG bash -c '
        echo \"\$REGISTRY_PASS\" | docker login -u \"\$DOCKER_USER\" --password-stdin
        docker pull \$IMAGE_NAME:\$IMAGE_TAG
        docker stop app || true
        docker rm app || true
        docker run -d --name app -p 5000:5000 \$IMAGE_NAME:\$IMAGE_TAG
      '
    "
